[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tessera"
version = "0.2.0"
description = "Agent Terminal for the Web — compiles websites into governed MCP terminals"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Tessera Contributors" },
]
keywords = ["mcp", "ai-agents", "web", "terminal", "governance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pydantic>=2.0",
    "requests>=2.28",
    "PyJWT>=2.6",
    "cryptography>=41.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "mcp>=2.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24",
]
all = ["tessera[server,dev]"]

[project.urls]
Repository = "https://github.com/tessera-agent/tessera"
Documentation = "https://github.com/tessera-agent/tessera#readme"

[project.scripts]
tessera = "tessera.cli.main:cli"

[tool.setuptools.packages.find]
include = ["tessera*"]

[tool.pytest.ini_options]
testpaths = ["evals", "conformance", "tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
tessera = ["py.typed"]
