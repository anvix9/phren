name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[all]"

      - name: Run tests
        run: pytest evals/ conformance/ -v

      - name: Verify contracts
        run: |
          phren verify simulations/shopping/contract.json
          phren verify simulations/booking/contract.json
          phren verify simulations/library/contract.json

      - name: Run demo
        run: phren demo

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t phren:test .

      - name: Verify image
        run: docker run --rm phren:test --help
